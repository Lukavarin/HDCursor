<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#0E0E10" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFFFF" />
      <stop offset="100%" stop-color="#99F4D1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg-grad)" stroke="#26262C" stroke-width="4" />

  <!-- Inner Subtle Accent Grid/Border -->
  <rect x="12" y="12" width="104" height="104" rx="20" fill="none" stroke="#26262C" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Shield Outline -->
  <path d="M64 24 L96 38 V66 C96 85 82 101 64 107 C46 101 32 85 32 66 V38 Z"
        fill="#18181B"
        stroke="url(#accent-grad)"
        stroke-width="5"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Phantom Cursor / Crosshair Symbol -->
  <path d="M50 44 L78 72 L66 74 L73 88 L65 92 L58 78 L48 85 Z"
        fill="none"
        stroke="#CCFFFF"
        stroke-width="3"
        stroke-linejoin="round" />

  <!-- Central Target Reticle -->
  <circle cx="64" cy="64" r="3" fill="#99F4D1" />
  <line x1="64" y1="52" x2="64" y2="57" stroke="#99F4D1" stroke-width="2" stroke-linecap="round" />
  <line x1="64" y1="71" x2="64" y2="76" stroke="#99F4D1" stroke-width="2" stroke-linecap="round" />
  <line x1="52" y1="64" x2="57" y2="64" stroke="#99F4D1" stroke-width="2" stroke-linecap="round" />
  <line x1="71" y1="64" x2="76" y2="64" stroke="#99F4D1" stroke-width="2" stroke-linecap="round" />
</svg>
